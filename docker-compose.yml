version: '3.8'

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - pipeline-net

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: flightuser
      POSTGRES_PASSWORD: flightpass
      POSTGRES_DB: flightdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pipeline-net

  spark:
    image: spark:python3
    container_name: spark
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "4040:4040"
    volumes:
      - ./spark-app:/opt/spark-apps
    networks:
      - pipeline-net
    entrypoint: ["tail", "-f", "/dev/null"]

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@flightpipeline.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - pipeline-net
  
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7.19
    container_name: dbt
    volumes:
      - ./dbt_project:/usr/app
      - ./dbt_profiles:/root/.dbt
    networks:
      - pipeline-net
    entrypoint: ["tail", "-f", "/dev/null"]

networks:
  pipeline-net:
    driver: bridge

volumes:
  pgdata: